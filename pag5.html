<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buscar Filmes e Séries</title>

<link rel="stylesheet" href="css2.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<body>

<header>
    <div class="logo">🎬 Clube dos Filmes</div>

    <nav>

</section>

<section class="catalogo">

        </div>

            <h1>Skins</h1>
        </div>

        <div class="card">
            <img src="lacasadepapel.jpg" alt="La casa de papel">
            <h1>La casa de papel</h1>

        <div class="card">
            <img src="homemaranha.jpg" alt="homem-aranha">
            <h1>Homem-Aranha</h1>
        </div>

        <div class="card">
            <img src="deadpool.jpg" alt="Deadpool">
            <h1>Deadpool</h1>
        </div>
