<!DOCTYPE html>
<html lang="pt-BR">

<title>Clube dos Filmes</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<body>

<header>
    <div class="logo">🎬 Clube dos Filmes</div>

    <nav>
    </nav>

</section>

        <div class="card">

            <img src="https://image.tmdb.org/t/p/w500/xkjWiRQtrenqGRWO2Enry2JIl4d.jpg" alt="Wicked">
