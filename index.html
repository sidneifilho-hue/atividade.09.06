<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clube dos Filmes</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<body>

<header>
    <div class="logo">🎬 Clube dos Filmes</div>

    <button class="btn-login">Entrar</button>

<section class="hero">
    <div class="overlay"></div>

    <div class="hero-content">
        <span class="categoria">FILME EM DESTAQUE</span>

        <h1>Interestelar</h1>

        <p>
            Uma jornada épica através do espaço e do tempo em busca
            da sobrevivência da humanidade.
        </p>

        <div class="hero-buttons">
            <button class="assistir">▶ Assistir</button>
            <button class="info">ⓘ Mais Informações</button>
        </div>
    </div>
</section>

<section class="catalogo">

    <div class="filmes">

        <div class="card">
